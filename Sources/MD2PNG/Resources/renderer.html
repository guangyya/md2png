<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: #1f2328;
      background: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; }
    body { width: max-content; min-width: 520px; }
    #card {
      width: max-content;
      min-width: 520px;
      max-width: 1120px;
      padding: 32px 36px;
      background: #ffffff;
      overflow: visible;
    }
    #card > :first-child { margin-top: 0; }
    #card > :last-child { margin-bottom: 0; }
    h1, h2, h3, h4, h5, h6 { line-height: 1.25; margin: 1.2em 0 .55em; }
    h1 { font-size: 2em; border-bottom: 1px solid #d8dee4; padding-bottom: .3em; }
    h2 { font-size: 1.5em; border-bottom: 1px solid #d8dee4; padding-bottom: .3em; }
    h3 { font-size: 1.25em; }
    p, ul, ol, blockquote, pre, table { margin: 0 0 16px; }
    a { color: #0969da; text-decoration: none; }
    blockquote { margin-left: 0; padding: 0 1em; color: #59636e; border-left: 4px solid #d0d7de; }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 88%;
      padding: .15em .35em;
      border-radius: 5px;
      background: #eff1f3;
    }
    pre {
      padding: 16px;
      overflow: visible;
      border: 1px solid #d8dee4;
      border-radius: 8px;
      background: #f6f8fa;
      white-space: pre-wrap;
      word-break: break-word;
    }
    pre code {
      display: block;
      padding: 0;
      color: #24292f;
      background: transparent;
      font-size: 85%;
    }
    .hljs-comment, .hljs-quote { color: #6e7781; font-style: italic; }
    .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-section,
    .hljs-doctag, .hljs-name { color: #cf222e; }
    .hljs-string, .hljs-regexp, .hljs-attribute, .hljs-template-tag,
    .hljs-template-variable { color: #0a3069; }
    .hljs-title, .hljs-title.class_, .hljs-title.function_ { color: #8250df; }
    .hljs-attr, .hljs-variable, .hljs-type, .hljs-number,
    .hljs-selector-class, .hljs-selector-attr, .hljs-selector-pseudo {
      color: #0550ae;
    }
    .hljs-symbol, .hljs-bullet, .hljs-built_in { color: #953800; }
    .hljs-meta, .hljs-meta .hljs-keyword { color: #116329; }
    .hljs-deletion { color: #82071e; background: #ffebe9; }
    .hljs-addition { color: #116329; background: #dafbe1; }
    .hljs-emphasis { font-style: italic; }
    .hljs-strong { font-weight: 600; }
    table { border-collapse: collapse; width: 100%; min-width: 460px; }
    th, td { padding: 8px 12px; border: 1px solid #d0d7de; text-align: left; vertical-align: top; }
    th { background: #f6f8fa; font-weight: 600; }
    tr:nth-child(even) td { background: #fbfcfd; }
    hr { height: 1px; padding: 0; margin: 24px 0; background: #d8dee4; border: 0; }
    .mermaid {
      display: flex;
      justify-content: center;
      min-width: 460px;
      margin: 20px 0;
      padding: 18px;
      border: 1px solid #d8dee4;
      border-radius: 10px;
      background: #ffffff;
    }
    .mermaid svg { max-width: none !important; height: auto; }
    .blocked-image { color: #59636e; font-style: italic; }
  </style>
</head>
<body>
  <main id="card" aria-label="Rendered Markdown"></main>
  <script src="renderer.bundle.js"></script>
</body>
</html>

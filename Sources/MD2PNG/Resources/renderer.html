<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="only light">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: only light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      line-height: 1.55;
      --background: #ffffff;
      --text: #1f2328;
      --muted-text: #59636e;
      --border: #d0d7de;
      --heading-border: #d8dee4;
      --link: #0969da;
      --inline-code: #eff1f3;
      --code-surface: #f6f8fa;
      --code-text: #24292f;
      --table-alternate: #fbfcfd;
      --syntax-comment: #6e7781;
      --syntax-keyword: #cf222e;
      --syntax-string: #0a3069;
      --syntax-title: #8250df;
      --syntax-variable: #0550ae;
      --syntax-symbol: #953800;
      --syntax-meta: #116329;
      --syntax-deletion-text: #82071e;
      --syntax-deletion-background: #ffebe9;
      --syntax-addition-text: #116329;
      --syntax-addition-background: #dafbe1;
      color: var(--text);
      background: var(--background);
    }
    :root[data-render-theme="warmPaper"] {
      --background: #fbf4e3;
      --text: #3d3428;
      --muted-text: #6f604d;
      --border: #d8c6a4;
      --heading-border: #d8c6a4;
      --link: #8a4b20;
      --inline-code: #efe2ca;
      --code-surface: #f3e8d4;
      --code-text: #3d3428;
      --table-alternate: #f7ecd8;
      --syntax-comment: #76644e;
      --syntax-keyword: #9f2f38;
      --syntax-string: #76520e;
      --syntax-title: #7048a8;
      --syntax-variable: #1e5e78;
      --syntax-symbol: #9a4b18;
      --syntax-meta: #3d6b45;
      --syntax-deletion-text: #842029;
      --syntax-deletion-background: #efd0c5;
      --syntax-addition-text: #35633c;
      --syntax-addition-background: #dce4c4;
    }
    :root[data-render-theme="dark"] {
      --background: #0d1117;
      --text: #e6edf3;
      --muted-text: #8b949e;
      --border: #30363d;
      --heading-border: #30363d;
      --link: #58a6ff;
      --inline-code: #21262d;
      --code-surface: #161b22;
      --code-text: #e6edf3;
      --table-alternate: #161b22;
      --syntax-comment: #8b949e;
      --syntax-keyword: #ff7b72;
      --syntax-string: #a5d6ff;
      --syntax-title: #d2a8ff;
      --syntax-variable: #79c0ff;
      --syntax-symbol: #ffa657;
      --syntax-meta: #7ee787;
      --syntax-deletion-text: #ffdcd7;
      --syntax-deletion-background: #5a1e23;
      --syntax-addition-text: #aff5b4;
      --syntax-addition-background: #1b4721;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--background); }
    body { width: max-content; min-width: 520px; }
    #card {
      width: max-content;
      min-width: 520px;
      max-width: 1120px;
      padding: 32px 36px;
      background: var(--background);
      overflow: visible;
    }
    #card > :first-child { margin-top: 0; }
    #card > :last-child { margin-bottom: 0; }
    h1, h2, h3, h4, h5, h6 { line-height: 1.25; margin: 1.2em 0 .55em; }
    h1 { font-size: 2em; border-bottom: 1px solid var(--heading-border); padding-bottom: .3em; }
    h2 { font-size: 1.5em; border-bottom: 1px solid var(--heading-border); padding-bottom: .3em; }
    h3 { font-size: 1.25em; }
    p, ul, ol, blockquote, pre, table { margin: 0 0 16px; }
    a { color: var(--link); text-decoration: none; }
    blockquote { margin-left: 0; padding: 0 1em; color: var(--muted-text); border-left: 4px solid var(--border); }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 88%;
      padding: .15em .35em;
      border-radius: 5px;
      background: var(--inline-code);
    }
    pre {
      padding: 16px;
      overflow: visible;
      border: 1px solid var(--heading-border);
      border-radius: 8px;
      background: var(--code-surface);
      white-space: pre-wrap;
      word-break: break-word;
    }
    pre code {
      display: block;
      padding: 0;
      color: var(--code-text);
      background: transparent;
      font-size: 85%;
    }
    .hljs-comment, .hljs-quote { color: var(--syntax-comment); font-style: italic; }
    .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-section,
    .hljs-doctag, .hljs-name { color: var(--syntax-keyword); }
    .hljs-string, .hljs-regexp, .hljs-attribute, .hljs-template-tag,
    .hljs-template-variable { color: var(--syntax-string); }
    .hljs-title, .hljs-title.class_, .hljs-title.function_ { color: var(--syntax-title); }
    .hljs-attr, .hljs-variable, .hljs-type, .hljs-number,
    .hljs-selector-class, .hljs-selector-attr, .hljs-selector-pseudo {
      color: var(--syntax-variable);
    }
    .hljs-symbol, .hljs-bullet, .hljs-built_in { color: var(--syntax-symbol); }
    .hljs-meta, .hljs-meta .hljs-keyword { color: var(--syntax-meta); }
    .hljs-deletion { color: var(--syntax-deletion-text); background: var(--syntax-deletion-background); }
    .hljs-addition { color: var(--syntax-addition-text); background: var(--syntax-addition-background); }
    .hljs-emphasis { font-style: italic; }
    .hljs-strong { font-weight: 600; }
    table { border-collapse: collapse; width: 100%; min-width: 460px; }
    th, td { padding: 8px 12px; border: 1px solid var(--border); text-align: left; vertical-align: top; }
    th { background: var(--code-surface); font-weight: 600; }
    tr:nth-child(even) td { background: var(--table-alternate); }
    hr { height: 1px; padding: 0; margin: 24px 0; background: var(--heading-border); border: 0; }
    .mermaid {
      display: flex;
      justify-content: center;
      min-width: 460px;
      margin: 20px 0;
      padding: 18px;
      border: 1px solid var(--heading-border);
      border-radius: 10px;
      background: var(--background);
    }
    .mermaid svg { max-width: none !important; height: auto; }
    .blocked-image { color: var(--muted-text); font-style: italic; }
  </style>
</head>
<body>
  <main id="card" aria-label="Rendered Markdown"></main>
  <script src="renderer.bundle.js"></script>
</body>
</html>

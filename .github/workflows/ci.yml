name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: CI / macOS arm64
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      EXPECTED_XCODE_VERSION: "26.2"
      EXPECTED_SWIFT_VERSION: "6.2.3"
      NODE_VERSION: "24.18.0"
      PNPM_VERSION: "11.19.0"
      PROJECT_URL: https://github.com/guangyya/md2png
      BUNDLE_IDENTIFIER: io.github.guangyya.md2png

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify pinned Apple toolchain
        shell: bash
        run: |
          test -d "$DEVELOPER_DIR"
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = "$EXPECTED_XCODE_VERSION"
          swift --version
          swift --version | grep -F "Apple Swift version $EXPECTED_SWIFT_VERSION"

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: arm64
          package-manager-cache: false

      - name: Install pinned renderer dependencies
        shell: bash
        run: |
          npm install --global "pnpm@$PNPM_VERSION"
          test "$(pnpm --version)" = "$PNPM_VERSION"
          pnpm --dir WebRenderer install --frozen-lockfile

      - name: Run tests
        run: make test

      - name: Build release app
        run: >-
          make app
          CONFIGURATION=release
          PROJECT_URL="$PROJECT_URL"
          BUNDLE_IDENTIFIER="$BUNDLE_IDENTIFIER"

      - name: Verify generated renderer is committed
        run: git diff --exit-code -- Sources/MD2PNG/Resources/renderer.bundle.js

      - name: Verify packaged app
        shell: bash
        run: |
          app="dist/md2png.app"
          executable="$app/Contents/MacOS/md2png"
          resources="$app/Contents/Resources"
          swift_resources="$resources/md2png_MD2PNG.bundle"

          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -F "Signature=adhoc"
          test "$(lipo -archs "$executable")" = "arm64"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "$BUNDLE_IDENTIFIER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MD2PNGProjectURL' "$app/Contents/Info.plist")" = "$PROJECT_URL"
          test -s "$swift_resources/renderer.bundle.js"
          test -s "$swift_resources/renderer.html"
          test -s "$resources/CHANGELOG.md"
          test -s "$resources/Examples/formatting.md"

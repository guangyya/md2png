name: Release preflight

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect Release PR
    runs-on: macos-15
    env:
      NODE_VERSION: "24.18.0"
    outputs:
      is_release: ${{ steps.detect.outputs.is_release }}
      bump: ${{ steps.detect.outputs.bump }}
      version: ${{ steps.detect.outputs.version }}
      build: ${{ steps.detect.outputs.build }}
      base_sha: ${{ steps.detect.outputs.base_sha }}
      head_sha: ${{ steps.detect.outputs.head_sha }}
    steps:
      - name: Check out pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: arm64
          package-manager-cache: false

      - name: Validate release metadata change
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git fetch origin main --tags

          base_root="$RUNNER_TEMP/release-base"
          mkdir -p "$base_root"
          for file in Info.plist CHANGELOG.md ABOUT_CHANGELOG.md; do
            git show "${BASE_SHA}:${file}" > "${base_root}/${file}"
          done
          base_metadata="$(node scripts/release-automation.mjs inspect --repo-root "$base_root")"
          head_metadata="$(node scripts/release-automation.mjs inspect --repo-root "$GITHUB_WORKSPACE")"
          base_version="$(jq -r .version <<< "$base_metadata")"
          base_build="$(jq -r .build <<< "$base_metadata")"
          head_version="$(jq -r .version <<< "$head_metadata")"
          head_build="$(jq -r .build <<< "$head_metadata")"

          if [[ "$base_version" = "$head_version" && "$base_build" = "$head_build" ]]; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "No release metadata change; hosted release preflight is not required." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$(git rev-parse origin/main)" != "$BASE_SHA" ]]; then
            echo "The Release PR base is stale; re-prepare it from current main." >&2
            exit 1
          fi
          if [[ "$base_version" = "$head_version" || "$base_build" = "$head_build" ]]; then
            echo "Both version keys must change together." >&2
            exit 1
          fi

          actual_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort)"
          expected_files="$(printf '%s\n' ABOUT_CHANGELOG.md CHANGELOG.md Info.plist | LC_ALL=C sort)"
          if [[ "$actual_files" != "$expected_files" ]]; then
            echo "A Release PR must modify exactly Info.plist and both changelogs." >&2
            printf 'Changed files:\n%s\n' "$actual_files" >&2
            exit 1
          fi

          plan_file="$RUNNER_TEMP/validated-release-plan.json"
          node scripts/release-automation.mjs validate-prepared \
            --base-root "$base_root" \
            --repo-root "$GITHUB_WORKSPACE" > "$plan_file"
          bump="$(jq -r .bump "$plan_file")"
          version="$(jq -r .version "$plan_file")"
          build="$(jq -r .build "$plan_file")"
          tag="$(jq -r .tag "$plan_file")"
          release_date="$(jq -r .date "$plan_file")"
          expected_date="$(node scripts/release-automation.mjs date --instant "$PR_CREATED_AT" | jq -r .date)"
          test "$release_date" = "$expected_date"

          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test "$latest_tag" = "v${base_version}"
          git rev-parse -q --verify "refs/tags/${latest_tag}" >/dev/null
          git show "${latest_tag}:Info.plist" > "$RUNNER_TEMP/latest-release-Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/latest-release-Info.plist")" = "$base_version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/latest-release-Info.plist")" = "$base_build"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Target tag already exists: $tag" >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Target Release already exists: $tag" >&2
            exit 1
          fi

          if [[ "$HEAD_REF" = codex/release-v* ]]; then
            test "$HEAD_REF" = "codex/release-v${version}"
            test "$PR_TITLE" = "Prepare md2png ${version}"
            case ",${PR_LABELS}," in
              *,release,* ) ;;
              * ) echo "Generated Release PR is missing the release label." >&2; exit 1 ;;
            esac
            case ",${PR_LABELS}," in
              *,release:${bump},* ) ;;
              * ) echo "Generated Release PR is missing release:${bump}." >&2; exit 1 ;;
            esac
          fi

          echo "is_release=true" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "## Valid Release PR"
            echo
            echo "- Base: $BASE_SHA"
            echo "- Source: $HEAD_SHA"
            echo "- Version: $base_version → $version ($bump)"
            echo "- Build: $base_build → $build"
            echo "- Tag: $tag"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Release preflight / Xcode 26.2
    if: needs.detect.outputs.is_release == 'true'
    needs: detect
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      NODE_VERSION: "24.18.0"
      PNPM_VERSION: "11.19.0"
      PROJECT_URL: https://github.com/guangyya/md2png
      BUNDLE_IDENTIFIER: io.github.guangyya.md2png
      SOURCE_COMMIT: ${{ needs.detect.outputs.head_sha }}
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.head_sha }}
          persist-credentials: false

      - name: Verify canonical toolchain
        run: |
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = "26.2"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          xcodebuild -version
          swift --version

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: arm64
          package-manager-cache: false

      - name: Install pinned renderer dependencies
        run: |
          npm install --global "pnpm@$PNPM_VERSION"
          test "$(pnpm --version)" = "$PNPM_VERSION"
          pnpm --dir WebRenderer install --frozen-lockfile

      - name: Run release tests
        run: |
          make test

      - name: Build and self-test proposed release
        run: >-
          make verify-dist
          CONFIGURATION=release
          SOURCE_COMMIT="$SOURCE_COMMIT"
          PROJECT_URL="$PROJECT_URL"
          BUNDLE_IDENTIFIER="$BUNDLE_IDENTIFIER"

      - name: Summarize proposed release
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          BUILD: ${{ needs.detect.outputs.build }}
          BUMP: ${{ needs.detect.outputs.bump }}
        run: |
          {
            echo "## Release preflight passed"
            echo
            echo "- Version/build: $VERSION ($BUILD)"
            echo "- Bump: $BUMP"
            echo "- Source: $SOURCE_COMMIT"
            echo "- Coverage: collected once by the trusted Release build after merge"
            echo "- Tag: v$VERSION"
            echo "- Release: md2png $VERSION"
            echo
            echo "### Assets"
            echo
            echo "- md2png-${VERSION}-macOS-arm64-developer-id.zip"
            echo "- md2png-${VERSION}-macOS-arm64-developer-id.dmg"
            echo "- md2png-latest.dmg"
            echo "- md2png-${VERSION}-coverage.json"
            echo "- md2png-${VERSION}-coverage.md"
            echo
            echo "### Release notes"
            echo
            ./scripts/release-notes.sh "$VERSION" CHANGELOG.md
          } >> "$GITHUB_STEP_SUMMARY"

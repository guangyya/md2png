name: Trusted Release

run-name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - Info.plist
  workflow_dispatch:
    inputs:
      commit:
        description: Exact existing main commit whose failed release should resume
        required: true
        type: string

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: trusted-release
  cancel-in-progress: false

jobs:
  detect:
    name: Validate merged release identity
    runs-on: macos-15
    outputs:
      is_release: ${{ steps.release.outputs.is_release }}
      already_published: ${{ steps.release.outputs.already_published }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      version: ${{ steps.release.outputs.version }}
      build: ${{ steps.release.outputs.build }}
      pr_number: ${{ steps.release.outputs.pr_number }}
      milestone_plan_sha256: ${{ steps.release.outputs.milestone_plan_sha256 }}
    env:
      NODE_VERSION: "24.18.0"
    steps:
      - name: Check out requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: arm64
          package-manager-cache: false

      - name: Validate release authorization
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          REQUESTED_COMMIT: ${{ inputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release source must be an exact commit." >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" = "workflow_dispatch" ]]; then
            if [[ ! "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ || "$REQUESTED_COMMIT" != "$source_commit" ]]; then
              echo "Recovery requires the exact 40-character main commit SHA." >&2
              exit 1
            fi
          fi
          git fetch origin main --tags
          git merge-base --is-ancestor "$source_commit" origin/main

          if [[ "$EVENT_NAME" = "push" ]]; then
            base_commit="$PUSH_BEFORE"
          else
            base_commit="$(git rev-parse "${source_commit}^1")"
          fi
          if [[ ! "$base_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Cannot resolve the release commit's previous main state." >&2
            exit 1
          fi

          base_root="$RUNNER_TEMP/release-base"
          mkdir -p "$base_root"
          for file in Info.plist CHANGELOG.md ABOUT_CHANGELOG.md; do
            git show "${base_commit}:${file}" > "${base_root}/${file}"
          done
          base_metadata="$(node scripts/release-automation.mjs inspect --repo-root "$base_root")"
          head_metadata="$(node scripts/release-automation.mjs inspect --repo-root "$GITHUB_WORKSPACE")"
          base_version="$(jq -r .version <<< "$base_metadata")"
          base_build="$(jq -r .build <<< "$base_metadata")"
          version="$(jq -r .version <<< "$head_metadata")"
          build="$(jq -r .build <<< "$head_metadata")"

          if [[ "$base_version" = "$version" && "$base_build" = "$build" ]]; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "Info.plist changed without changing release identity; nothing to publish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$base_version" = "$version" || "$base_build" = "$build" ]]; then
            echo "Both committed version keys must change together." >&2
            exit 1
          fi

          plan_file="$RUNNER_TEMP/validated-release-plan.json"
          node scripts/release-automation.mjs validate-prepared \
            --base-root "$base_root" \
            --repo-root "$GITHUB_WORKSPACE" > "$plan_file"
          test "$(jq -r .version "$plan_file")" = "$version"
          test "$(jq -r .build "$plan_file")" = "$build"

          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          already_published=false
          case "$latest_tag" in
            "v${base_version}")
              latest_version="$base_version"
              latest_build="$base_build"
              ;;
            "v${version}")
              latest_version="$version"
              latest_build="$build"
              already_published=true
              test "$(git cat-file -t "refs/tags/${latest_tag}")" = "tag"
              test "$(git rev-parse "refs/tags/${latest_tag}^{}")" = "$source_commit"
              ;;
            *)
              echo "Latest stable Release must be the previous version or this exact release." >&2
              exit 1
              ;;
          esac
          git rev-parse -q --verify "refs/tags/${latest_tag}" >/dev/null
          git show "${latest_tag}:Info.plist" > "$RUNNER_TEMP/latest-release-Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/latest-release-Info.plist")" = "$latest_version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/latest-release-Info.plist")" = "$latest_build"

          pr_json="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/${source_commit}/pulls" \
            --jq '[.[] | select(.base.ref == "main" and .merged_at != null)]')"
          pr_count="$(jq 'length' <<< "$pr_json")"
          if [[ "$pr_count" != "1" ]]; then
            echo "Release source must correspond to exactly one merged PR targeting main." >&2
            exit 1
          fi
          pr_number="$(jq -r '.[0].number' <<< "$pr_json")"
          merge_commit="$(jq -r '.[0].merge_commit_sha' <<< "$pr_json")"
          pr_head_sha="$(jq -r '.[0].head.sha' <<< "$pr_json")"
          test "$merge_commit" = "$source_commit"
          if [[ ! "$pr_head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Cannot resolve the authorizing PR head commit." >&2
            exit 1
          fi

          pr_head_message="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/git/commits/${pr_head_sha}" --jq .message)"
          milestone_plan_sha256="$(sed -n 's/^Release-Milestone-Plan-SHA256: //p' <<< "$pr_head_message")"
          milestone_digest_count="$(grep -c '^Release-Milestone-Plan-SHA256: ' <<< "$pr_head_message" || true)"
          if [[ "$milestone_digest_count" -gt 1 \
            || ( -n "$milestone_plan_sha256" && ! "$milestone_plan_sha256" =~ ^[0-9a-f]{64}$ ) ]]; then
            echo "The authorizing PR head has invalid release milestone metadata." >&2
            exit 1
          fi

          checks_json="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/${pr_head_sha}/check-runs?per_page=100" \
            --jq '.check_runs')"
          for required_check in \
            "CI / macOS 15 / Xcode 26.2" \
            "CI / macOS 26 / Xcode 26.6" \
            "Detect Release PR" \
            "Release preflight / Xcode 26.2"; do
            check_state="$(jq -r --arg name "$required_check" \
              '[.[] | select(.name == $name)] | sort_by(.started_at) | last | (.conclusion // .status // "") | ascii_upcase' \
              <<< "$checks_json")"
            if [[ -z "$check_state" ]]; then
              echo "The authorizing PR is missing required check: $required_check" >&2
              exit 1
            fi
            if [[ "$check_state" != "SUCCESS" ]]; then
              echo "Required check did not succeed: $required_check ($check_state)" >&2
              exit 1
            fi
          done

          echo "is_release=true" >> "$GITHUB_OUTPUT"
          echo "already_published=$already_published" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "milestone_plan_sha256=$milestone_plan_sha256" >> "$GITHUB_OUTPUT"
          {
            echo "## Authorized release"
            echo
            echo "- Source: $source_commit"
            echo "- Pull request: #$pr_number"
            echo "- Version/build: $version ($build)"
            echo "- Tag: v$version"
            echo "- Already published: $already_published"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-published:
    name: Verify existing published release
    if: needs.detect.outputs.is_release == 'true' && needs.detect.outputs.already_published == 'true'
    needs: detect
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    env:
      NODE_VERSION: "24.18.0"
      GH_HOST: github.com
      GH_REPO: ${{ github.repository }}
      PROJECT_URL: https://github.com/guangyya/md2png
      BUNDLE_IDENTIFIER: io.github.guangyya.md2png
      SOURCE_COMMIT: ${{ needs.detect.outputs.source_commit }}
      EXPECTED_VERSION: ${{ needs.detect.outputs.version }}
      EXPECTED_BUILD: ${{ needs.detect.outputs.build }}
      EXPECTED_CERTIFICATE_SHA256: 3728788AF9FF5D9719C964C068610705D3D80D72D94DBC518B54EC5A21F05E66
    steps:
      - name: Check out trusted verification implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: arm64
          package-manager-cache: false

      - name: Verify protected-main trust boundary
        env:
          WORKFLOW_COMMIT: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "Published release verification must run from refs/heads/main." >&2
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main --tags
          git merge-base --is-ancestor "$WORKFLOW_COMMIT" refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$WORKFLOW_COMMIT"

      - name: Verify published release without mutation
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/verify-published-release.sh

  validate:
    name: Validate release and collect coverage
    if: needs.detect.outputs.is_release == 'true' && needs.detect.outputs.already_published != 'true'
    needs: detect
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      NODE_VERSION: "24.18.0"
      PNPM_VERSION: "11.19.0"
      PROJECT_URL: https://github.com/guangyya/md2png
      BUNDLE_IDENTIFIER: io.github.guangyya.md2png
      SOURCE_COMMIT: ${{ needs.detect.outputs.source_commit }}
      VERSION: ${{ needs.detect.outputs.version }}
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.source_commit }}
          persist-credentials: false

      - name: Stage trusted release asset tooling
        env:
          WORKFLOW_COMMIT: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "Release asset tooling must come from refs/heads/main." >&2
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main
          git cat-file -e "${WORKFLOW_COMMIT}^{commit}"
          git merge-base --is-ancestor "$WORKFLOW_COMMIT" refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$WORKFLOW_COMMIT"
          trusted_dir="$RUNNER_TEMP/release-asset-tooling"
          mkdir -p "$trusted_dir"
          for file in release-assets.mjs release-assets.json release-manifest.mjs; do
            git show "${WORKFLOW_COMMIT}:scripts/${file}" > "$trusted_dir/$file"
            test -s "$trusted_dir/$file"
          done
          chmod +x "$trusted_dir/release-assets.mjs" "$trusted_dir/release-manifest.mjs"
          printf 'RELEASE_ASSETS_SCRIPT=%s\n' "$trusted_dir/release-assets.mjs" >> "$GITHUB_ENV"
          printf 'RELEASE_MANIFEST_SCRIPT=%s\n' "$trusted_dir/release-manifest.mjs" >> "$GITHUB_ENV"

      - name: Verify canonical toolchain
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = "26.2"
          xcodebuild -version
          swift --version

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: arm64
          package-manager-cache: false

      - name: Install pinned renderer dependencies
        run: |
          npm install --global "pnpm@$PNPM_VERSION"
          test "$(pnpm --version)" = "$PNPM_VERSION"
          pnpm --dir WebRenderer install --frozen-lockfile

      - name: Test, collect coverage, and verify ad-hoc package
        run: |
          make coverage SOURCE_COMMIT="$SOURCE_COMMIT"
          make coverage-validate SOURCE_COMMIT="$SOURCE_COMMIT"
          make verify-dist \
            CONFIGURATION=release \
            SOURCE_COMMIT="$SOURCE_COMMIT" \
            PROJECT_URL="$PROJECT_URL" \
            BUNDLE_IDENTIFIER="$BUNDLE_IDENTIFIER"
          git diff --exit-code -- Sources/MD2PNG/Resources/renderer.bundle.js
          test -z "$(git status --porcelain)"

      - name: Stage normalized coverage handoff
        run: |
          mkdir -p .build/coverage-handoff
          asset_contract="$(node "$RELEASE_ASSETS_SCRIPT" json --version "$VERSION")"
          for key in coverageJson coverageMarkdown; do
            source_path="$(jq -er --arg key "$key" '.assets[] | select(.key == $key) | .sourcePath' <<< "$asset_contract")"
            cp "$source_path" .build/coverage-handoff/
          done

      - name: Upload short-lived coverage handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-coverage-${{ needs.detect.outputs.source_commit }}
          path: .build/coverage-handoff/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  sign:
    name: Sign and notarize exact release
    if: needs.detect.outputs.is_release == 'true' && needs.detect.outputs.already_published != 'true'
    needs:
      - detect
      - validate
    runs-on: macos-15
    timeout-minutes: 60
    environment: release-signing
    permissions:
      actions: read
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      NODE_VERSION: "24.18.0"
      PNPM_VERSION: "11.19.0"
      PROJECT_URL: https://github.com/guangyya/md2png
      BUNDLE_IDENTIFIER: io.github.guangyya.md2png
      SOURCE_COMMIT: ${{ needs.detect.outputs.source_commit }}
      VERSION: ${{ needs.detect.outputs.version }}
      BUILD: ${{ needs.detect.outputs.build }}
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.source_commit }}
          persist-credentials: false

      - name: Stage trusted release asset tooling
        env:
          WORKFLOW_COMMIT: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "Release asset tooling must come from refs/heads/main." >&2
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main
          git cat-file -e "${WORKFLOW_COMMIT}^{commit}"
          git merge-base --is-ancestor "$WORKFLOW_COMMIT" refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$WORKFLOW_COMMIT"
          trusted_dir="$RUNNER_TEMP/release-asset-tooling"
          mkdir -p "$trusted_dir"
          for file in release-assets.mjs release-assets.json release-manifest.mjs; do
            git show "${WORKFLOW_COMMIT}:scripts/${file}" > "$trusted_dir/$file"
            test -s "$trusted_dir/$file"
          done
          chmod +x "$trusted_dir/release-assets.mjs" "$trusted_dir/release-manifest.mjs"
          printf 'RELEASE_ASSETS_SCRIPT=%s\n' "$trusted_dir/release-assets.mjs" >> "$GITHUB_ENV"
          printf 'RELEASE_MANIFEST_SCRIPT=%s\n' "$trusted_dir/release-manifest.mjs" >> "$GITHUB_ENV"

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: arm64
          package-manager-cache: false

      - name: Install pinned renderer dependencies
        run: |
          npm install --global "pnpm@$PNPM_VERSION"
          test "$(pnpm --version)" = "$PNPM_VERSION"
          pnpm --dir WebRenderer install --frozen-lockfile

      - name: Download verified coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-coverage-${{ needs.detect.outputs.source_commit }}
          path: .build/coverage/

      - name: Import, verify, sign, notarize, and assemble handoff
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.RELEASE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.RELEASE_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.RELEASE_SIGN_IDENTITY }}
          EXPECTED_CERTIFICATE_SHA256: ${{ secrets.RELEASE_CERTIFICATE_SHA256 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/md2png-release.keychain-db"
          certificate="$RUNNER_TEMP/md2png-release.p12"
          certificate_pem="$RUNNER_TEMP/md2png-release.pem"
          profile="md2png-notary-$GITHUB_RUN_ID"
          keychain_password="$(openssl rand -hex 32)"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -f "$certificate" "$certificate_pem"
          }
          trap cleanup EXIT

          printf '%s' "$CERTIFICATE_P12_BASE64" | /usr/bin/base64 --decode > "$certificate"
          test -s "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain"

          security find-identity -v -p codesigning "$keychain" | grep -F "\"${SIGN_IDENTITY}\""
          case "$SIGN_IDENTITY" in
            "Developer ID Application:"*" (${APPLE_TEAM_ID})") ;;
            *) echo "Signing identity does not match the configured Apple Team ID." >&2; exit 1 ;;
          esac
          security find-certificate -c "$SIGN_IDENTITY" -p "$keychain" > "$certificate_pem"
          openssl x509 -checkend 0 -noout -in "$certificate_pem"
          actual_fingerprint="$(openssl x509 -in "$certificate_pem" -noout -fingerprint -sha256 |
            cut -d= -f2 |
            tr -d ':' |
            tr '[:lower:]' '[:upper:]')"
          expected_fingerprint="$(printf '%s' "$EXPECTED_CERTIFICATE_SHA256" |
            tr -d ':' |
            tr '[:lower:]' '[:upper:]')"
          test "$actual_fingerprint" = "$expected_fingerprint"

          xcrun notarytool store-credentials "$profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$keychain"

          asset_contract="$(node "$RELEASE_ASSETS_SCRIPT" json --version "$VERSION")"
          coverage_json_path="$(jq -er '.assets[] | select(.key == "coverageJson") | .sourcePath' <<< "$asset_contract")"
          node scripts/coverage-report.mjs validate \
            --report "$coverage_json_path" \
            --app-version "$VERSION" \
            --commit "$SOURCE_COMMIT"
          make notarize \
            CONFIGURATION=release \
            SOURCE_COMMIT="$SOURCE_COMMIT" \
            PROJECT_URL="$PROJECT_URL" \
            BUNDLE_IDENTIFIER="$BUNDLE_IDENTIFIER" \
            SIGN_IDENTITY="$SIGN_IDENTITY" \
            NOTARY_PROFILE="$profile" \
            NOTARY_KEYCHAIN="$keychain" \
            RELEASE_SUFFIX=developer-id

          handoff=".build/release-handoff"
          mkdir -p "$handoff"
          release_dmg_path="$(jq -er '.assets[] | select(.key == "releaseDmg") | .sourcePath' <<< "$asset_contract")"
          while IFS= read -r asset; do
            key="$(jq -r .key <<< "$asset")"
            name="$(jq -r .name <<< "$asset")"
            source_path="$(jq -r .sourcePath <<< "$asset")"
            if [[ "$key" = "latestDmg" ]]; then
              source_path="$release_dmg_path"
            fi
            cp "$source_path" "$handoff/$name"
          done < <(jq -c '.assets[]' <<< "$asset_contract")
          node "$RELEASE_MANIFEST_SCRIPT" create \
            --output "$handoff/release-manifest.json" \
            --directory "$handoff" \
            --version "$VERSION" \
            --build "$BUILD" \
            --commit "$SOURCE_COMMIT"

      - name: Upload verified signed handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-${{ needs.detect.outputs.source_commit }}
          path: .build/release-handoff/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish verified release
    if: needs.detect.outputs.is_release == 'true' && needs.detect.outputs.already_published != 'true'
    needs:
      - detect
      - sign
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      issues: write
    env:
      NODE_VERSION: "24.18.0"
      GH_HOST: github.com
      GH_REPO: ${{ github.repository }}
      PROJECT_URL: https://github.com/guangyya/md2png
      BUNDLE_IDENTIFIER: io.github.guangyya.md2png
      SOURCE_COMMIT: ${{ needs.detect.outputs.source_commit }}
      EXPECTED_MILESTONE_PLAN_SHA256: ${{ needs.detect.outputs.milestone_plan_sha256 }}
      RELEASE_HANDOFF_DIR: ${{ github.workspace }}/.build/release-handoff
    steps:
      - name: Check out exact release source with publication token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: arm64
          package-manager-cache: false

      - name: Download verified signed handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-${{ needs.detect.outputs.source_commit }}
          path: .build/release-handoff/

      - name: Stage trusted publication implementation
        env:
          WORKFLOW_COMMIT: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "Release publication recovery must run from refs/heads/main." >&2
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main
          git cat-file -e "${WORKFLOW_COMMIT}^{commit}"
          git merge-base --is-ancestor "$WORKFLOW_COMMIT" refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$WORKFLOW_COMMIT"
          trusted_publisher="$RUNNER_TEMP/publish-hosted-release.sh"
          trusted_release_assets="$RUNNER_TEMP/release-assets.mjs"
          trusted_asset_contract="$RUNNER_TEMP/release-assets.json"
          trusted_release_manifest="$RUNNER_TEMP/release-manifest.mjs"
          trusted_release_milestone="$RUNNER_TEMP/release-milestone.mjs"
          git show "${WORKFLOW_COMMIT}:scripts/publish-hosted-release.sh" > "$trusted_publisher"
          git show "${WORKFLOW_COMMIT}:scripts/release-assets.mjs" > "$trusted_release_assets"
          git show "${WORKFLOW_COMMIT}:scripts/release-assets.json" > "$trusted_asset_contract"
          git show "${WORKFLOW_COMMIT}:scripts/release-manifest.mjs" > "$trusted_release_manifest"
          git show "${WORKFLOW_COMMIT}:scripts/release-milestone.mjs" > "$trusted_release_milestone"
          chmod +x "$trusted_publisher"
          test -s "$trusted_publisher"
          test -s "$trusted_release_assets"
          test -s "$trusted_asset_contract"
          test -s "$trusted_release_manifest"
          test -s "$trusted_release_milestone"
          printf 'TRUSTED_PUBLISHER=%s\n' "$trusted_publisher" >> "$GITHUB_ENV"
          printf 'RELEASE_ASSETS_SCRIPT=%s\n' "$trusted_release_assets" >> "$GITHUB_ENV"
          printf 'RELEASE_MANIFEST_SCRIPT=%s\n' "$trusted_release_manifest" >> "$GITHUB_ENV"
          printf 'RELEASE_MILESTONE_SCRIPT=%s\n' "$trusted_release_milestone" >> "$GITHUB_ENV"

      - name: Publish or safely resume exact release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: REPO_ROOT="$GITHUB_WORKSPACE" "$TRUSTED_PUBLISHER"
